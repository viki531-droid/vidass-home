<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS - מארגן טיולים וחופשות</title>
    <!-- קישור לקובץ הסנכרון והאחסון האחיד -->
    <script src="storage-sync.js"></script>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            padding: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .house-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--success); padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        .input-section {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1.5fr auto;
            gap: 10px;
            margin-bottom: 24px;
        }

        @media (max-width: 700px) {
            .input-section { grid-template-columns: 1fr; }
        }

        .input-section input {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 13px;
            outline: none;
            text-align: right;
        }

        .input-section input:focus {
            border-color: var(--primary);
        }

        .add-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover { opacity: 0.9; }

        .travel-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 50vh;
            overflow-y: auto;
            padding-left: 4px;
        }

        .travel-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .travel-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .travel-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        .travel-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .travel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .map-link-btn {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .map-link-btn:hover { background: rgba(59, 130, 246, 0.3); }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: 0.2s;
        }

        .delete-btn:hover { background: rgba(239, 68, 68, 0.2); }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🚗 מארגן טיולים וחופשות</h1>
        <div class="house-badge" id="houseBadgeDisplay">🟢 בית: טוען...</div>
    </div>

    <div class="input-section">
        <input type="text" id="destinationInput" placeholder="יעד או שם הטיול (לדוגמה: טיול שבת בפארק שחמון)..." onkeypress="if(event.key==='Enter') addTravelItem()">
        <input type="text" id="dateInput" placeholder="תאריך (לדוגמה: 15.06.2026)..." onkeypress="if(event.key==='Enter') addTravelItem()">
        <input type="text" id="mapLinkInput" placeholder="קישור למפה (אופציונלי)..." onkeypress="if(event.key==='Enter') addTravelItem()">
        <button class="add-btn" onclick="addTravelItem()">הוסף טיול ➕</button>
    </div>

    <div class="travel-list" id="travelListContainer">
        <!-- יעדי הטיולים יטענו לכאן דינמית -->
    </div>
</div>

<script>
    // זיהוי קוד הבית והתאמה למערכת הסנכרון
    const urlParams = new URLSearchParams(window.location.search);
    let houseCode = urlParams.get('house') || 
                    (typeof getCurrentHouseCode === 'function' ? getCurrentHouseCode() : null) || 
                    localStorage.getItem('vidass_current_house_code') || 
                    localStorage.getItem('vidass_current_house') || 
                    'EILAT-33';

    houseCode = houseCode.trim();
    localStorage.setItem('vidass_current_house_code', houseCode);
    localStorage.setItem('vidass_current_house', houseCode);

    window.onload = function() {
        document.getElementById('houseBadgeDisplay').innerText = `🟢 בית: ${houseCode}`;
        loadTravels();
    };

    function loadTravels() {
        const travels = (typeof getSharedData === 'function') ? getSharedData('travel') : [];
        const container = document.getElementById('travelListContainer');

        if (!travels || travels.length === 0) {
            container.innerHTML = `<div class="empty-state">אין טיולים או חופשות מתוכננים כרגע. אפשר להוסיף יעד חדש למעלה!</div>`;
            return;
        }

        container.innerHTML = '';
        travels.slice().reverse().forEach((item, index) => {
            const actualIndex = travels.length - 1 - index;
            
            let mapButtonHtml = '';
            if (item.mapLink) {
                let cleanLink = item.mapLink.trim();
                if (!cleanLink.startsWith('http://') && !cleanLink.startsWith('https://')) {
                    cleanLink = 'https://' + cleanLink;
                }
                mapButtonHtml = `<a href="${escapeHtml(cleanLink)}" target="_blank" class="map-link-btn">🗺️ פתח מפה</a>`;
            }

            container.innerHTML += `
                <div class="travel-item">
                    <div class="travel-info">
                        <div class="travel-title">📍 ${escapeHtml(item.destination)}</div>
                        <div class="travel-meta">תאריך: <strong>${escapeHtml(item.date || 'לא צוין')}</strong> | נוסף ע"י: ${escapeHtml(item.addedBy || 'דייר')}</div>
                    </div>
                    <div class="travel-actions">
                        ${mapButtonHtml}
                        <button class="delete-btn" onclick="deleteTravel(${actualIndex})">מחק 🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    function addTravelItem() {
        const destInput = document.getElementById('destinationInput');
        const dateInput = document.getElementById('dateInput');
        const mapInput = document.getElementById('mapLinkInput');
        
        const destination = destInput.value.trim();
        const date = dateInput.value.trim() || 'קרוב';
        const mapLink = mapInput.value.trim();
        
        if (!destination) {
            alert("נא להזין יעד או שם לטיול.");
            return;
        }

        let travels = (typeof getSharedData === 'function') ? getSharedData('travel') : [];
        const currentUser = (typeof getCurrentUser === 'function' ? getCurrentUser() : null) || 
                            localStorage.getItem('vidass_current_user') || 
                            'דייר';

        travels.push({
            destination: destination,
            date: date,
            mapLink: mapLink,
            addedBy: currentUser
        });

        saveAndRefresh(travels);
        destInput.value = '';
        dateInput.value = '';
        mapInput.value = '';
        destInput.focus();
    }

    function deleteTravel(index) {
        let travels = (typeof getSharedData === 'function') ? getSharedData('travel') : [];
        if (travels[index] !== undefined) {
            travels.splice(index, 1);
            saveAndRefresh(travels);
        }
    }

    function saveAndRefresh(travelsArray) {
        if (typeof saveSharedData === 'function') {
            saveSharedData('travel', travelsArray);
        } else {
            localStorage.setItem('vidass_travel_' + houseCode, JSON.stringify(travelsArray));
        }
        loadTravels();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
