<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS Micro-App - מארגן טיולים וחופשות מתקדם</title>
    <!-- קישור לקובץ הסנכרון המשותף בין דיירי הבית -->
    <script src="storage-sync.js"></script>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .app-container { width: 100%; max-width: 680px; background: var(--card-bg); backdrop-filter: blur(14px); border: 1px solid var(--card-border); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px; }
        .header h1 { font-size: 20px; color: var(--accent); }
        .badge { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--success); padding: 4px 10px; border-radius: 8px; font-size: 11px; }
        
        .section-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .section-box h3 { color: var(--gold); font-size: 14px; margin-bottom: 10px; }

        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 13px; outline: none; text-align: right; }
        .input-group textarea { resize: none; height: 60px; }
        
        .row-inputs { display: flex; gap: 10px; }
        .row-inputs .input-group { flex: 1; }

        .btn { width: 100%; padding: 11px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }

        .trip-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; margin-bottom: 12px; font-size: 13px; }
        .trip-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 8px; }
        
        .map-link { display: inline-block; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: var(--gold); padding: 4px 10px; border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: bold; margin-top: 6px; }
        .map-link:hover { background: rgba(245, 158, 11, 0.3); }

        .checklist-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 6px 10px; border-radius: 8px; margin-top: 4px; font-size: 12px; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: white; padding: 10px 20px; border-radius: 10px; font-size: 13px; transition: transform 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>🚗 מארגן טיולים וחופשות מתקדם</h1>
            <p style="font-size: 11px; color: var(--text-muted);">ניהול מסלולים, קישורי מפות ורשימות ציוד משפחתיות</p>
        </div>
        <div class="badge" id="houseBadge">🟢 מחובר לבית המשותף</div>
    </div>

    <!-- אזור הוספת טיול חדש -->
    <div class="section-box">
        <h3>➕ תכנון טיול או חופשה חדשה</h3>
        <div class="row-inputs">
            <div class="input-group">
                <label>יעד הטיול / החופשה</label>
                <input type="text" id="tripDestination" placeholder="לדוגמה: סוף שבוע באילת / טיול בצפון...">
            </div>
            <div class="input-group">
                <label>תאריך ושעה</label>
                <input type="text" id="tripDate" placeholder="לדוגמה: 15/07/2026 בשעה 08:00...">
            </div>
        </div>

        <div class="input-group">
            <label>קישור למפה (Google Maps / Waze Link)</label>
            <input type="url" id="tripMapUrl" placeholder="הדבק כאן את קישור המפה או הניווט...">
        </div>

        <div class="input-group">
            <label>תאור המסלול, מלון והערות חשובות</label>
            <textarea id="tripNotes" placeholder="פרט את זמני הנסיעה, מקומות עצירה, ציוד נדרש או הנחיות מיוחדות..."></textarea>
        </div>

        <div class="input-group">
            <label>פריטים לאריזה / ציוד נדרש (הפרד בפסיקים)</label>
            <input type="text" id="tripGear" placeholder="לדוגמה: בגדי ים, קרם הגנה, מטען נייד, מפתחות...">
        </div>

        <button class="btn" onclick="addTripRecord()">שמור טיול מלא למערכת המשפחתית 🚗</button>
    </div>

    <h3 style="font-size: 14px; color: var(--accent); margin-bottom: 8px; text-align: right;">טיולים וחופשות מתוכננים:</h3>
    <div style="max-height: 280px; overflow-y: auto;" id="tripsList"></div>
</div>

<div class="toast" id="toastMsg">הפעולה בוצעה בהצלחה!</div>

<script>
    window.onload = function() {
        const houseCode = getCurrentHouseCode();
        if(houseCode) {
            document.getElementById('houseBadge').innerText = `🟢 בית: ${houseCode}`;
        }
        loadTrips();
    };

    function loadTrips() {
        const data = getSharedData('travel');
        const container = document.getElementById('tripsList');
        
        container.innerHTML = data.length === 0 ? '<p style="text-align:center; font-size:12px; color:var(--text-muted);">אין טיולים מתוכננים במערכת כרגע.</p>' : '';
        
        data.slice().reverse().forEach((item, index) => {
            const actualIndex = data.length - 1 - index;
            
            // יצירת כפתור מפה אם הוכנס קישור
            let mapBtnHTML = '';
            if(item.mapUrl) {
                let cleanUrl = item.mapUrl.startsWith('http') ? item.mapUrl : 'https://' + item.mapUrl;
                mapBtnHTML = `<a href="${cleanUrl}" target="_blank" class="map-link">📍 פתח ניווט במפה (Google/Waze)</a>`;
            }

            // יצירת רשימת ציוד (צ'ק ליסט)
            let gearHTML = '';
            if(item.gear && item.gear.length > 0) {
                gearHTML = `<div style="margin-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 6px;">
                    <div style="font-size:11px; color:var(--gold); font-weight:bold; margin-bottom:4px;">🎒 רשימת ציוד ופריטים לאריזה:</div>`;
                item.gear.forEach((gearItem, gIndex) => {
                    gearHTML += `
                        <div class="checklist-item">
                            <span>✔️ ${gearItem}</span>
                        </div>`;
                });
                gearHTML += `</div>`;
            }

            container.innerHTML += `
                <div class="trip-card">
                    <div class="trip-header">
                        <div>
                            <strong style="color:var(--accent); font-size:15px;">🚗 ${item.destination}</strong>
                            <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">🕒 מועד: ${item.tripDate || 'לא צוין'}</div>
                        </div>
                        <button onclick="removeTripRecord(${actualIndex})" style="background:rgba(239,68,68,0.1); color:var(--danger); border:1px solid rgba(239,68,68,0.3); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:11px;">מחק</button>
                    </div>
                    <div style="font-size:13px; color:var(--text-main); margin-bottom:6px; white-space:pre-line;">${item.notes || 'אין הערות נוספות.'}</div>
                    ${mapBtnHTML}
                    ${gearHTML}
                    <div style="font-size:10px; color:var(--success); margin-top:6px; text-align: left;">נוסף ע"י: ${item.addedBy || 'דייר'} | ${item.date}</div>
                </div>`;
        });
    }

    function addTripRecord() {
        const destination = document.getElementById('tripDestination').value.trim();
        const tripDate = document.getElementById('tripDate').value.trim();
        const mapUrl = document.getElementById('tripMapUrl').value.trim();
        const notes = document.getElementById('tripNotes').value.trim();
        const gearRaw = document.getElementById('tripGear').value.trim();

        if(!destination) {
            showToast("נא להזין לפחות את יעד הטיול", true);
            return;
        }

        // פירוק פריטי הציוד לפי פסיקים לפריטים נפרדים
        let gearList = gearRaw ? gearRaw.split(',').map(item => item.trim()).filter(item => item.length > 0) : [];

        let data = getSharedData('travel');
        data.push({ 
            destination, 
            tripDate,
            mapUrl,
            notes,
            gear: gearList,
            addedBy: getCurrentUser(),
            date: new Date().toLocaleDateString('he-IL') 
        });
        saveSharedData('travel', data);

        // איפוס שדות
        document.getElementById('tripDestination').value = '';
        document.getElementById('tripDate').value = '';
        document.getElementById('tripMapUrl').value = '';
        document.getElementById('tripNotes').value = '';
        document.getElementById('tripGear').value = '';

        loadTrips();
        showToast("תכנון הטיול, המפה ורשימת הציוד נשמרו בהצלחה!");
    }

    function removeTripRecord(index) {
        let data = getSharedData('travel');
        data.splice(index, 1);
        saveSharedData('travel', data);
        loadTrips();
        showToast("הטיול הוסר מרשימת החופשות.");
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
</script>

</body>
</html>
