<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS - כניסה למערכת הבית</title>
    <script src="storage-sync.js"></script>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); padding: 30px; text-align: center; }
        .monkey { font-size: 50px; margin-bottom: 10px; }
        h1 { font-size: 22px; color: var(--accent); margin-bottom: 6px; }
        p { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
        
        .input-group { margin-bottom: 14px; text-align: right; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 11px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 13px; outline: none; text-align: right; }
        
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 6px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); margin-top: 12px; }

        .error-msg { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 10px; font-size: 12px; margin-bottom: 12px; display: none; }
        
        .toggle-mode { font-size: 12px; color: var(--accent); margin-top: 16px; cursor: pointer; display: inline-block; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="monkey">🐵</div>
    <h1 id="formTitle">כניסה לבית של VIDASS</h1>
    <p id="formSub">הכנס קוד בית וסיסמה משותפת כדי להתחבר לכולם</p>

    <div class="error-msg" id="errorMsg">שגיאה בפרטים, נסה שוב.</div>

    <!-- טופס כניסה ראשי -->
    <div id="loginFormSection">
        <div class="input-group">
            <label>קוד הבית (למשל: EILAT-33)</label>
            <input type="text" id="houseCodeInput" placeholder="הכנס קוד בית...">
        </div>
        <div class="input-group">
            <label>השם שלך (למשל: ויקי / דוד)</label>
            <input type="text" id="userNameInput" placeholder="הכנס את שמך...">
        </div>
        <div class="input-group">
            <label>סיסמת הבית המשותפת</label>
            <input type="password" id="housePasswordInput" placeholder="הכנס סיסמה...">
        </div>
        <button class="btn" onclick="handleHouseLogin()">הכנס למערכת הבית 🚀</button>
        <span class="toggle-mode" onclick="toggleRegisterMode()">אין לך בית רשום? לחץ כאן להקמת בית חדש 🏠</span>
    </div>

    <!-- טופס הקמת בית חדש (לשימושך הראשוני) -->
    <div id="registerFormSection" style="display: none;">
        <div class="input-group">
            <label>שם המשפחה / קוד בית חדש</label>
            <input type="text" id="newHouseCode" placeholder="לדוגמה: EILAT-33...">
        </div>
        <div class="input-group">
            <label>שם מנהל הבית</label>
            <input type="text" id="newAdminName" placeholder="הכנס את שמך...">
        </div>
        <div class="input-group">
            <label>בחר סיסמה משותפת לכל בני הבית</label>
            <input type="password" id="newHousePassword" placeholder="בחר סיסמה לכולם...">
        </div>
        <button class="btn btn-gold" onclick="handleCreateHouse()">צור בית חדש וענן משותף 🏠</button>
        <span class="toggle-mode" onclick="toggleRegisterMode()">כבר יש לך בית? חזרה למסך הכניסה 🔑</span>
    </div>
</div>

<script>
    window.onload = function() {
        // בדיקה האם הגיע קוד בית אוטומטי מהקישור בוואטסאפ
        const urlParams = new URLSearchParams(window.location.search);
        const houseFromUrl = urlParams.get('house');
        if(houseFromUrl) {
            document.getElementById('houseCodeInput').value = houseFromUrl;
        }
    };

    function toggleRegisterMode() {
        const loginSec = document.getElementById('loginFormSection');
        const regSec = document.getElementById('registerFormSection');
        const title = document.getElementById('formTitle');
        const sub = document.getElementById('formSub');

        if(loginSec.style.display === 'none') {
            loginSec.style.display = 'block';
            regSec.style.display = 'none';
            title.innerText = "כניסה לבית של VIDASS";
            sub.innerText = "הכנס קוד בית וסיסמה משותפת כדי להתחבר לכולם";
        } else {
            loginSec.style.display = 'none';
            regSec.style.display = 'block';
            title.innerText = "הקמת בית חדש ב-VIDASS";
            sub.innerText = "צור קוד בית וסיסמה משותפת שתוכל לתת לדוד ולשאר הדיירים";
        }
    }

    function handleHouseLogin() {
        const houseCode = document.getElementById('houseCodeInput').value.trim();
        const userName = document.getElementById('userNameInput').value.trim();
        const password = document.getElementById('housePasswordInput').value.trim();

        if(!houseCode || !userName || !password) {
            showError("נא למלא את כל השדות!");
            return;
        }

        // שמירה מקומית במכשיר
        localStorage.setItem("vidass_current_house", houseCode);
        localStorage.setItem("vidass_current_house_code", houseCode);
        localStorage.setItem("vidass_current_user", userName);
        localStorage.setItem("vidass_house_pass", password);

        // מעבר מיידי ללוח המרכזי
        window.location.href = "main_hub.html";
    }

    function handleCreateHouse() {
        const houseCode = document.getElementById('newHouseCode').value.trim();
        const adminName = document.getElementById('newAdminName').value.trim();
        const password = document.getElementById('newHousePassword').value.trim();

        if(!houseCode || !adminName || !password) {
            showError("נא למלא את כל שדות הקמת הבית!");
            return;
        }

        localStorage.setItem("vidass_current_house", houseCode);
        localStorage.setItem("vidass_current_house_code", houseCode);
        localStorage.setItem("vidass_current_user", adminName);
        localStorage.setItem("vidass_house_pass", password);

        alert(`הבית "${houseCode}" הוקם בהצלחה!\nעכשיו כל מי שיתחבר עם קוד הבית והסיסמה הזו יתחבר ישירות אליך.`);
        window.location.href = "main_hub.html";
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.innerText = msg;
        err.style.display = 'block';
    }
</script>

</body>
</html>
