<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS - ניהול דיירים והזמנות</title>
    <!-- קישור לקובץ הסנכרון והאחסון האחיד -->
    <script src="storage-sync.js"></script>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            padding: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .house-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--success); padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        .input-section {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1.2fr auto;
            gap: 10px;
            margin-bottom: 24px;
        }

        @media (max-width: 700px) {
            .input-section { grid-template-columns: 1fr; }
        }

        .input-section input, .input-section select {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 13px;
            outline: none;
            text-align: right;
        }

        .input-section option {
            background: #1a1622;
            color: white;
        }

        .input-section input:focus, .input-section select:focus {
            border-color: var(--primary);
        }

        .add-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover { opacity: 0.9; }

        .members-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 50vh;
            overflow-y: auto;
            padding-left: 4px;
        }

        .member-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .member-name {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        .member-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: 0.2s;
        }

        .delete-btn:hover { background: rgba(239, 68, 68, 0.2); }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>👥 ניהול דיירי הבית והרשאות</h1>
        <div class="house-badge" id="houseBadgeDisplay">🟢 בית: טוען...</div>
    </div>

    <div class="input-section">
        <input type="text" id="memberNameInput" placeholder="שם הדייר/ת (לדוגמה: דוד)..." onkeypress="if(event.key==='Enter') addMember()">
        <input type="text" id="memberPhoneInput" placeholder="מספר טלפון (אופציונלי)..." onkeypress="if(event.key==='Enter') addMember()">
        <select id="memberRoleInput">
            <option value="מנהל הבית">👑 מנהל הבית</option>
            <option value="דייר משפחה">🏡 דייר משפחה</option>
            <option value="אורח / צופה">👁️ אורח / צופה</option>
        </select>
        <button class="add-btn" onclick="addMember()">הוסף דייר ➕</button>
    </div>

    <div class="members-list" id="membersListContainer">
        <!-- רשימת הדיירים תטען לכאן דינמית -->
    </div>
</div>

<script>
    // זיהוי קוד הבית והתאמה למערכת הסנכרון
    const urlParams = new URLSearchParams(window.location.search);
    let houseCode = urlParams.get('house') || 
                    (typeof getCurrentHouseCode === 'function' ? getCurrentHouseCode() : null) || 
                    localStorage.getItem('vidass_current_house_code') || 
                    localStorage.getItem('vidass_current_house') || 
                    'EILAT-33';

    houseCode = houseCode.trim();
    localStorage.setItem('vidass_current_house_code', houseCode);
    localStorage.setItem('vidass_current_house', houseCode);

    window.onload = function() {
        document.getElementById('houseBadgeDisplay').innerText = `🟢 בית: ${houseCode}`;
        loadMembers();
    };

    function loadMembers() {
        // ניהול דיירים נשמר בתוך מערך המנוהל תחת מפתח members
        const members = (typeof getSharedData === 'function') ? getSharedData('members') : [];
        const container = document.getElementById('membersListContainer');

        if (!members || members.length === 0) {
            container.innerHTML = `<div class="empty-state">אין דיירים רשומים כרגע. אפשר להוסיף דייר חדש למעלה!</div>`;
            return;
        }

        container.innerHTML = '';
        members.forEach((member, index) => {
            container.innerHTML += `
                <div class="member-item">
                    <div class="member-info">
                        <div class="member-name">👤 ${escapeHtml(member.name)}</div>
                        <div class="member-meta">תפקיד: <strong>${escapeHtml(member.role || 'דייר')}</strong> | טלפון: ${escapeHtml(member.phone || 'לא צוין')}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteMember(${index})">הסר דייר 🗑️</button>
                </div>
            `;
        });
    }

    function addMember() {
        const nameInput = document.getElementById('memberNameInput');
        const phoneInput = document.getElementById('memberPhoneInput');
        const roleInput = document.getElementById('memberRoleInput');
        
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim() || 'לא צוין';
        const role = roleInput.value;
        
        if (!name) {
            alert("נא להזין את שם הדייר/ת.");
            return;
        }

        let members = (typeof getSharedData === 'function') ? getSharedData('members') : [];

        members.push({
            name: name,
            phone: phone,
            role: role
        });

        saveAndRefresh(members);
        nameInput.value = '';
        phoneInput.value = '';
        nameInput.focus();
    }

    function deleteMember(index) {
        let members = (typeof getSharedData === 'function') ? getSharedData('members') : [];
        if (members[index] !== undefined) {
            members.splice(index, 1);
            saveAndRefresh(members);
        }
    }

    function saveAndRefresh(membersArray) {
        if (typeof saveSharedData === 'function') {
            saveSharedData('members', membersArray);
        } else {
            localStorage.setItem('vidass_members_' + houseCode, JSON.stringify(membersArray));
        }
        loadMembers();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
