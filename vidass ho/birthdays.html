<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS Micro-App - ימי הולדת</title>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .app-container { width: 100%; max-width: 600px; background: var(--card-bg); backdrop-filter: blur(14px); border: 1px solid var(--card-border); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px; }
        .header h1 { font-size: 20px; color: var(--accent); }
        .badge { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--success); padding: 4px 10px; border-radius: 8px; font-size: 11px; }
        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 13px; outline: none; text-align: right; }
        .btn { width: 100%; padding: 11px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .item-row { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: white; padding: 10px 20px; border-radius: 10px; font-size: 13px; transition: transform 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>🎂 דפדפן ימי הולדת</h1>
            <p style="font-size: 11px; color: var(--text-muted);">מיקרו-אפליקציה לתזכורות שמחות</p>
        </div>
        <div class="badge">🟢 פעיל ומאובטח</div>
    </div>

    <div class="input-group">
        <label>שם בני המשפחה / חבר</label>
        <input type="text" id="bdayName" placeholder="לדוגמה: דוד, אגם, לוטם...">
    </div>
    <div class="input-group">
        <label>תאריך יום ההולדת (לדוגמה: 15/02)</label>
        <input type="text" id="bdayDate" placeholder="הכנס תאריך..." onkeypress="if(event.key==='Enter') addBirthday()">
    </div>
    <button class="btn" onclick="addBirthday()">שמור יום הולדת 🎂</button>

    <div style="margin-top: 20px; max-height: 240px; overflow-y: auto;" id="birthdaysList"></div>
</div>

<div class="toast" id="toastMsg">הפעולה בוצעה בהצלחה!</div>

<script>
    function loadBirthdays() {
        const data = JSON.parse(localStorage.getItem('vidass_sub_browser_birthdays')) || [];
        const container = document.getElementById('birthdaysList');
        
        container.innerHTML = data.length === 0 ? '<p style="text-align:center; font-size:12px; color:var(--text-muted);">אין ימי הולדת שמורים במערכת כרגע.</p>' : '';
        data.slice().reverse().forEach((item, index) => {
            const actualIndex = data.length - 1 - index;
            container.innerHTML += `
                <div class="item-row">
                    <div>
                        <strong style="color:var(--accent);">🎂 ${item.name}</strong>
                        <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">תאריך: ${item.bdayDate}</div>
                    </div>
                    <button onclick="removeBirthday(${actualIndex})" style="background:rgba(239,68,68,0.1); color:var(--danger); border:1px solid rgba(239,68,68,0.3); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:11px;">מחק</button>
                </div>`;
        });
    }

    function addBirthday() {
        const nameInput = document.getElementById('bdayName');
        const dateInput = document.getElementById('bdayDate');
        const name = nameInput.value.trim();
        const bdayDate = dateInput.value.trim();

        if(!name || !bdayDate) { showToast("נא למלא את כל השדות", true); return; }

        let data = JSON.parse(localStorage.getItem('vidass_sub_browser_birthdays')) || [];
        data.push({ name, bdayDate });
        localStorage.setItem('vidass_sub_browser_birthdays', JSON.stringify(data));

        nameInput.value = '';
        dateInput.value = '';
        loadBirthdays();
        showToast("יום ההולדת נשמר בהצלחה!");
    }

    function removeBirthday(index) {
        let data = JSON.parse(localStorage.getItem('vidass_sub_browser_birthdays')) || [];
        data.splice(index, 1);
        localStorage.setItem('vidass_sub_browser_birthdays', JSON.stringify(data));
        loadBirthdays();
        showToast("הרישום הוסר בהצלחה.");
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    window.onload = loadBirthdays;
</script>

</body>
</html>
