<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS - ניהול מלאי הבית</title>
    <!-- קישור לקובץ הסנכרון והאחסון האחיד -->
    <script src="storage-sync.js"></script>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            padding: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .house-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--success); padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        .input-section {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 10px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .input-section { grid-template-columns: 1fr; }
        }

        .input-section input, .input-section select {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 13px;
            outline: none;
            text-align: right;
        }

        .input-section input option, .input-section select option {
            background: #1a1622;
            color: white;
        }

        .input-section input:focus, .input-section select:focus {
            border-color: var(--primary);
        }

        .add-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover { opacity: 0.9; }

        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 50vh;
            overflow-y: auto;
            padding-left: 4px;
        }

        .inventory-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .inventory-item.low-stock {
            border-color: rgba(245, 158, 11, 0.4);
            background: rgba(245, 158, 11, 0.04);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-name {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        .item-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .shop-btn {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .shop-btn:hover { background: rgba(16, 185, 129, 0.3); }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.2); }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>📦 מלאי הבית ומעקב מוצרים</h1>
        <div class="house-badge" id="houseBadgeDisplay">🟢 בית: טוען...</div>
    </div>

    <div class="input-section">
        <input type="text" id="itemNameInput" placeholder="שם המוצר (לדוגמה: שמן זית, חלב)..." onkeypress="if(event.key==='Enter') addItem()">
        <input type="text" id="itemQtyInput" placeholder="כמות (לדוגמה: 2 יח', 1 ליטר)..." onkeypress="if(event.key==='Enter') addItem()">
        <button class="add-btn" onclick="addItem()">הוסף למלאי ➕</button>
    </div>

    <div class="inventory-list" id="inventoryListContainer">
        <!-- פריטי המלאי יטענו לכאן דינמית -->
    </div>
</div>

<script>
    // זיהוי קוד הבית והתאמה למערכת הסנכרון
    const urlParams = new URLSearchParams(window.location.search);
    let houseCode = urlParams.get('house') || 
                    (typeof getCurrentHouseCode === 'function' ? getCurrentHouseCode() : null) || 
                    localStorage.getItem('vidass_current_house_code') || 
                    localStorage.getItem('vidass_current_house') || 
                    'EILAT-33';

    houseCode = houseCode.trim();
    localStorage.setItem('vidass_current_house_code', houseCode);
    localStorage.setItem('vidass_current_house', houseCode);

    window.onload = function() {
        document.getElementById('houseBadgeDisplay').innerText = `🟢 בית: ${houseCode}`;
        loadInventory();
    };

    function loadInventory() {
        const inventory = (typeof getSharedData === 'function') ? getSharedData('inventory') : [];
        const container = document.getElementById('inventoryListContainer');

        if (!inventory || inventory.length === 0) {
            container.innerHTML = `<div class="empty-state">אין פריטים רשומים במלאי כרגע. אפשר להוסיף פריטים חדשים למעלה!</div>`;
            return;
        }

        container.innerHTML = '';
        inventory.slice().reverse().forEach((item, index) => {
            const actualIndex = inventory.length - 1 - index;
            container.innerHTML += `
                <div class="inventory-item">
                    <div class="item-info">
                        <div class="item-name">📦 ${escapeHtml(item.name)}</div>
                        <div class="item-meta">כמות: <strong>${escapeHtml(item.quantity || '1')}</strong> | עודכן ע"י: ${escapeHtml(item.addedBy || 'דייר')}</div>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn shop-btn" onclick="sendToShopping('${escapeHtml(item.name)}')">העבר לקניות 🛒</button>
                        <button class="action-btn delete-btn" onclick="deleteItem(${actualIndex})">מחק 🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    function addItem() {
        const nameInput = document.getElementById('itemNameInput');
        const qtyInput = document.getElementById('itemQtyInput');
        
        const name = nameInput.value.trim();
        const quantity = qtyInput.value.trim() || '1 יח\'';
        
        if (!name) return;

        let inventory = (typeof getSharedData === 'function') ? getSharedData('inventory') : [];
        const currentUser = (typeof getCurrentUser === 'function' ? getCurrentUser() : null) || 
                            localStorage.getItem('vidass_current_user') || 
                            'דייר';

        inventory.push({
            name: name,
            quantity: quantity,
            addedBy: currentUser,
            date: new Date().toLocaleDateString('he-IL')
        });

        saveAndRefresh(inventory);
        nameInput.value = '';
        qtyInput.value = '';
        nameInput.focus();
    }

    function deleteItem(index) {
        let inventory = (typeof getSharedData === 'function') ? getSharedData('inventory') : [];
        if (inventory[index] !== undefined) {
            inventory.splice(index, 1);
            saveAndRefresh(inventory);
        }
    }

    // פונקציה חכמה שמעבירה מוצר מהמלאי ישירות לרשימת הקניות המשותפת!
    function sendToShopping(itemName) {
        let shopping = (typeof getSharedData === 'function') ? getSharedData('shopping') : [];
        const currentUser = (typeof getCurrentUser === 'function' ? getCurrentUser() : null) || 
                            localStorage.getItem('vidass_current_user') || 
                            'דייר';

        // בדיקה שהמוצר לא קיים כבר ברשימת הקניות
        const exists = shopping.some(item => item.text === itemName);
        if (!exists) {
            shopping.push({
                text: itemName,
                completed: false,
                addedBy: currentUser,
                date: new Date().toLocaleDateString('he-IL')
            });

            if (typeof saveSharedData === 'function') {
                saveSharedData('shopping', shopping);
            } else {
                localStorage.setItem('vidass_shopping_' + houseCode, JSON.stringify(shopping));
            }
            alert(`המוצר "${itemName}" הועבר בהצלחה לרשימת הקניות! 🛒`);
        } else {
            alert(`המוצר "${itemName}" כבר קיים ברשימת הקניות.`);
        }
    }

    function saveAndRefresh(inventoryArray) {
        if (typeof saveSharedData === 'function') {
            saveSharedData('inventory', inventoryArray);
        } else {
            localStorage.setItem('vidass_inventory_' + houseCode, JSON.stringify(inventoryArray));
        }
        loadInventory();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
