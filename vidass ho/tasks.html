<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS - ניהול משימות ומטלות בית</title>
    <!-- קישור לקובץ הסנכרון והאחסון האחיד -->
    <script src="storage-sync.js"></script>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            padding: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .house-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--success); padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 13px;
            outline: none;
            text-align: right;
        }

        .input-section input:focus {
            border-color: var(--primary);
        }

        .add-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover { opacity: 0.9; }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 50vh;
            overflow-y: auto;
            padding-left: 4px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .task-item.completed {
            background: rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.2);
            opacity: 0.75;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .task-text {
            font-size: 14px;
            color: var(--text-main);
            word-break: break-word;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>📌 משימות ומטלות בית</h1>
        <div class="house-badge" id="houseBadgeDisplay">🟢 בית: טוען...</div>
    </div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="הוסף משימה חדשה (לדוגמה: לקנות חלב, לתקן את הדלת)..." onkeypress="if(event.key==='Enter') addTask()">
        <button class="add-btn" onclick="addTask()">הוסף משימה ➕</button>
    </div>

    <div class="tasks-list" id="tasksListContainer">
        <!-- המשימות יטענו לכאן דינמית -->
    </div>
</div>

<script>
    // זיהוי קוד הבית והתאמה למערכת הסנכרון
    const urlParams = new URLSearchParams(window.location.search);
    let houseCode = urlParams.get('house') || 
                    (typeof getCurrentHouseCode === 'function' ? getCurrentHouseCode() : null) || 
                    localStorage.getItem('vidass_current_house_code') || 
                    localStorage.getItem('vidass_current_house') || 
                    'EILAT-33';

    houseCode = houseCode.trim();
    localStorage.setItem('vidass_current_house_code', houseCode);
    localStorage.setItem('vidass_current_house', houseCode);

    window.onload = function() {
        document.getElementById('houseBadgeDisplay').innerText = `🟢 בית: ${houseCode}`;
        loadTasks();
    };

    function loadTasks() {
        const tasks = (typeof getSharedData === 'function') ? getSharedData('tasks') : [];
        const container = document.getElementById('tasksListContainer');

        if (!tasks || tasks.length === 0) {
            container.innerHTML = `<div class="empty-state">אין משימות פעילות כרגע. אפשר להוסיף משימה חדשה למעלה!</div>`;
            return;
        }

        container.innerHTML = '';
        // הצגת המשימות (החדשות ביותר למעלה)
        tasks.slice().reverse().forEach((task, index) => {
            const actualIndex = tasks.length - 1 - index;
            container.innerHTML += `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-info">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${actualIndex})">
                        <div>
                            <div class="task-text">${escapeHtml(task.text)}</div>
                            <div class="task-meta">נוסף ע"י: ${escapeHtml(task.addedBy || 'דייר')} | ${task.date || ''}</div>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${actualIndex})">מחק 🗑️</button>
                </div>
            `;
        });
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if (!text) return;

        let tasks = (typeof getSharedData === 'function') ? getSharedData('tasks') : [];
        const currentUser = (typeof getCurrentUser === 'function' ? getCurrentUser() : null) || 
                            localStorage.getItem('vidass_current_user') || 
                            'דייר';

        tasks.push({
            text: text,
            completed: false,
            addedBy: currentUser,
            date: new Date().toLocaleDateString('he-IL')
        });

        saveAndRefresh(tasks);
        input.value = '';
    }

    function toggleTask(index) {
        let tasks = (typeof getSharedData === 'function') ? getSharedData('tasks') : [];
        if (tasks[index]) {
            tasks[index].completed = !tasks[index].completed;
            saveAndRefresh(tasks);
        }
    }

    function deleteTask(index) {
        let tasks = (typeof getSharedData === 'function') ? getSharedData('tasks') : [];
        if (tasks[index] !== undefined) {
            tasks.splice(index, 1);
            saveAndRefresh(tasks);
        }
    }

    function saveAndRefresh(tasksArray) {
        if (typeof saveSharedData === 'function') {
            saveSharedData('tasks', tasksArray);
        } else {
            localStorage.setItem('vidass_tasks_' + houseCode, JSON.stringify(tasksArray));
        }
        loadTasks();
    }

    // הגנה מפני הזרקת קוד בטקסט
    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
