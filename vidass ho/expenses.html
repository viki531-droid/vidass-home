<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDASS Micro-App - הוצאות הבית ותלושי שכר</title>
    <style>
        :root {
            --primary: #d84370;
            --primary-dark: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #0d0d0f 0%, #1a1622 100%);
            --card-bg: rgba(26, 23, 33, 0.96);
            --card-border: rgba(216, 67, 112, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .app-container { width: 100%; max-width: 600px; background: var(--card-bg); backdrop-filter: blur(14px); border: 1px solid var(--card-border); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px; }
        .header h1 { font-size: 20px; color: var(--accent); }
        .badge { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--success); padding: 4px 10px; border-radius: 8px; font-size: 11px; }
        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 13px; outline: none; text-align: right; }
        .input-group option { background: #1a1622; color: white; }
        .btn { width: 100%; padding: 11px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .item-row { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: white; padding: 10px 20px; border-radius: 10px; font-size: 13px; transition: transform 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>📄 הוצאות הבית ותלושי שכר</h1>
            <p style="font-size: 11px; color: var(--text-muted);">מיקרו-אפליקציה פיננסית מאובטחת</p>
        </div>
        <div class="badge">🟢 פעיל ומאובטח</div>
    </div>

    <div class="input-group">
        <label>סוג תנועה</label>
        <select id="expType">
            <option value="הכנסה / שכר נטו">📥 הכנסה / שכר נטו</option>
            <option value="הוצאה שוטפת">📤 הוצאה שוטפת (ארנונה, חשמל, קניות)</option>
        </select>
    </div>
    <div class="input-group">
        <label>תיאור הנתון</label>
        <input type="text" id="expDesc" placeholder="לדוגמה: משכורת נטו / חשבון חשמל...">
    </div>
    <div class="input-group">
        <label>סכום (₪)</label>
        <input type="number" id="expAmount" placeholder="לדוגמה: 7500" onkeypress="if(event.key==='Enter') addExpenseRecord()">
    </div>
    <button class="btn" onclick="addExpenseRecord()">שמור נתון פיננסי 💾</button>

    <div style="margin-top: 20px; max-height: 240px; overflow-y: auto;" id="expensesList"></div>
</div>

<div class="toast" id="toastMsg">הפעולה בוצעה בהצלחה!</div>

<script>
    function loadExpenses() {
        const data = JSON.parse(localStorage.getItem('vidass_sub_browser_expenses')) || [];
        const container = document.getElementById('expensesList');
        
        container.innerHTML = data.length === 0 ? '<p style="text-align:center; font-size:12px; color:var(--text-muted);">אין נתונים פיננסיים שמורים כרגע.</p>' : '';
        data.slice().reverse().forEach((item, index) => {
            const actualIndex = data.length - 1 - index;
            const isIncome = item.type.includes('הכנסה');
            const colorStyle = isIncome ? 'var(--success)' : 'var(--danger)';
            const sign = isIncome ? '+' : '-';
            
            container.innerHTML += `
                <div class="item-row">
                    <div>
                        <strong style="color:${colorStyle};">${item.type}: ${item.desc}</strong>
                        <div style="font-size:13px; font-weight:bold; margin-top:2px;">סכום: ${sign}${item.amount} ₪ <span style="font-size:10px; color:var(--text-muted); font-weight:normal;">(${item.date})</span></div>
                    </div>
                    <button onclick="removeExpenseRecord(${actualIndex})" style="background:rgba(239,68,68,0.1); color:var(--danger); border:1px solid rgba(239,68,68,0.3); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:11px;">מחק</button>
                </div>`;
        });
    }

    function addExpenseRecord() {
        const type = document.getElementById('expType').value;
        const desc = document.getElementById('expDesc').value.trim();
        const amount = document.getElementById('expAmount').value.trim();

        if(!desc || !amount) { showToast("נא למלא את כל השדות", true); return; }

        let data = JSON.parse(localStorage.getItem('vidass_sub_browser_expenses')) || [];
        data.push({ type, desc, amount, date: new Date().toLocaleDateString('he-IL') });
        localStorage.setItem('vidass_sub_browser_expenses', JSON.stringify(data));

        document.getElementById('expDesc').value = '';
        document.getElementById('expAmount').value = '';
        loadExpenses();
        showToast("הנתון הפיננסי נשמר והוצפן בהצלחה!");
    }

    function removeExpenseRecord(index) {
        let data = JSON.parse(localStorage.getItem('vidass_sub_browser_expenses')) || [];
        data.splice(index, 1);
        localStorage.setItem('vidass_sub_browser_expenses', JSON.stringify(data));
        loadExpenses();
        showToast("הרישום הוסר בהצלחה.");
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    window.onload = loadExpenses;
</script>

</body>
</html>
